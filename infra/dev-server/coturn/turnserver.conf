# coturn (STUN/TURN) for the ResumeRound dev server.
# Rendered by setup.sh: ${VARIABLES} are replaced from /etc/resumeround/secrets.env and the
# instance metadata. Do not put real secrets in this file.

listening-port=3478
listening-ip=${PRIVATE_IP}
relay-ip=${PRIVATE_IP}
# Behind AWS 1:1 NAT: public address / private address.
external-ip=${PUBLIC_IP}/${PRIVATE_IP}

# Relay ports must sit inside the UDP range open in the AWS security group (10000-10200).
# 10000-10100 is used by Janus.
min-port=10101
max-port=10200

# Time-limited credentials (TURN REST API): the backend derives username/password from this
# secret and an expiry, and returns them with the ICE servers in POST /interviews/:id/join.
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${TURN_REALM}
fingerprint

# TLS comes later with the domain (TURN over TLS on 5349/443).
no-tls
no-dtls
no-cli
no-multicast-peers
no-tcp-relay

# Never relay into private networks (protects the AWS VPC and metadata service), except Janus
# on this host.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=${PRIVATE_IP}

user-quota=12
total-quota=1200
stale-nonce=600

syslog
simple-log
